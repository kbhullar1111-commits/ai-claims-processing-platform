services:

  postgres:
    image: postgres:15
    container_name: claims-postgres
    networks:
      - claims-network
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d

  claims-api:
    container_name: claims-api
    build:
      context: ../..
      dockerfile: services/claims-service/ClaimsService.API/Dockerfile
    # Base compose contains steady-state runtime services only.
    # Run migrations separately before first startup or after schema changes.
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=claimsdb;Username=postgres;Password=postgres
      ConnectionStrings__ServiceBus: ${SERVICEBUS_CONNECTION_STRING}
      ApplicationInsights__ConnectionString: ${APPINSIGHTS_CONNECTION_STRING}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - claims-network
    ports:
      - "5001:8080"

  notification-api:
    container_name: notification-api
    build:
      context: ../..
      dockerfile: services/notification-service/NotificationService.API/Dockerfile
    # Base compose contains steady-state runtime services only.
    # Run migrations separately before first startup or after schema changes.
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=notificationdb;Username=postgres;Password=postgres
      ConnectionStrings__ServiceBus: ${SERVICEBUS_CONNECTION_STRING}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPINSIGHTS_CONNECTION_STRING}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - claims-network
    ports:
      - "5002:8080"
  
  document-api:
    container_name: document-api
    build:
      context: ../..
      dockerfile: services/document-service/DocumentService.API/Dockerfile
    # Base compose contains steady-state runtime services only.
    # Run migrations separately before first startup or after schema changes.
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=documentdb;Username=postgres;Password=postgres
      ConnectionStrings__ServiceBus: ${SERVICEBUS_CONNECTION_STRING}
      ConnectionStrings__BlobStorage: ${BLOB_STORAGE_CONNECTION_STRING}
      Storage__ContainerName: claim-documents
      ApplicationInsights__ConnectionString: ${APPINSIGHTS_CONNECTION_STRING}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - claims-network
    ports:
      - "5003:8080"

  fraud-api:
    container_name: fraud-api
    build:
      context: ../..
      dockerfile: services/fraud-service/FraudService.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ServiceBus: ${SERVICEBUS_CONNECTION_STRING}
      ApplicationInsights__ConnectionString: ${APPINSIGHTS_CONNECTION_STRING}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - claims-network
    ports:
      - "5005:8080"

  payment-api:
    container_name: payment-api
    build:
      context: ../..
      dockerfile: services/payment-service/PaymentService.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ServiceBus: ${SERVICEBUS_CONNECTION_STRING}
      ApplicationInsights__ConnectionString: ${APPINSIGHTS_CONNECTION_STRING}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - claims-network
    ports:
      - "5004:8080"

networks:
  claims-network:
    name: claims-network
    driver: bridge

volumes:
  postgres-data: